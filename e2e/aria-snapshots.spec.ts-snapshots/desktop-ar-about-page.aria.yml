- main:
  - heading "حول التطبيق" [level=1]
  - region "ما الذي تكتبه":
    - heading "ما الذي تكتبه" [level=2]
    - paragraph: مفاتيح تعلّمك الطباعة بالعربية دون النظر إلى لوحة المفاتيح. في التلاوة تكتب القرآن مقطعًا بعد مقطع كما هو مكتوب. وفي التمرين تتدرّب على كلمات من الحياة اليومية بحركاتها حتى يستقر كل مفتاح تحت أصابعك.
    - paragraph: "لا يظهر القرآن إلا كاملًا ومرتّبًا، وفي التلاوة وحدها، من نص مشروع تنزيل دون تغيير. ولا يستعمله التمرين أبدًا: كلماته من الحياة اليومية."
  - region "الخصوصية":
    - heading "الخصوصية" [level=2]
    - paragraph: لا حسابات ولا ملفات تعريف ارتباط ولا أدوات تحليل في مفاتيح. يبقى تقدمك وإعداداتك في هذا المتصفح، في التخزين المحلي. وتُحفظ التلاوات التي شغّلتها أو التي توشك أن تُشغَّل في قاعدة بيانات المتصفح لتعمل مرة أخرى دون تنزيل. الطلب الوحيد إلى موقع آخر هو لهذه التلاوات، ويرى ذلك الموقع عنوانك كما يراه أي موقع تزوره. ولا يرسل مفاتيح شيئًا آخر عنك. والنسخ الاحتياطي في الإعدادات ينشئ ملفًا تحتفظ به بنفسك.
  - region "المصادر":
    - heading "المصادر" [level=2]
    - term: نص القرآن
    - definition:
      - text: النص المبسّط، الإصدار 1.1، برخصة المشاع الإبداعي نسب المصنف 3.0. منسوخ دون تغيير، ويحتفظ ملف كل سورة بإشعار حقوق مشروع تنزيل.
      - link "Tanzil Project":
        - /url: https://tanzil.net
    - term: التلاوة الصوتية
    - definition:
      - text: عبد الباسط عبد الصمد، مرتل ومجوّد.
      - link "EveryAyah":
        - /url: https://everyayah.com
    - term: كلمات التمرين
    - definition:
      - text: صُنعت من ويكاموس الإنجليزي (النسخة المستخرجة في ⁨٣٠‏/١٠‏/٢٠٢٦⁩)، برخصة المشاع الإبداعي نسب المصنف والترخيص بالمثل 4.0 ورخصة جنو للوثائق الحرة، ومن قائمة بتكرار الكلمات برخصة المشاع الإبداعي نسب المصنف والترخيص بالمثل 4.0.
      - link "Wiktionary via kaikki.org":
        - /url: https://kaikki.org/dictionary/Arabic/
      - link "FrequencyWords":
        - /url: https://github.com/hermitdave/FrequencyWords
    - term: الخطوط
    - definition:
      - text: نسخ نوتو العربي وأميري وشهرزاد الجديد، برخصة الخطوط المفتوحة.
      - link "Fontsource":
        - /url: https://fontsource.org
    - term: تخطيط لوحة المفاتيح
    - definition:
      - text: /جدول المفاتيح يتبع تخطيط ويندوز العربي \(\d+\)\./
      - link /Microsoft Arabic \(\d+\) keyboard/:
        - /url: https://learn.microsoft.com/en-us/globalization/keyboards/kbda1
    - term: الشيفرة المصدرية
    - definition:
      - text: الموقع كله مفتوح للقراءة.
      - link "Source code on GitHub":
        - /url: https://github.com/scuba-plaza/mafatih
  - region "ملاحظة حول صنع الموقع":
    - heading "ملاحظة حول صنع الموقع" [level=2]
    - paragraph: كُتب معظم هذا الموقع بمساعدة مساعد ذكاء اصطناعي (⁨Claude⁩) وراجعه صاحبه. نرجو أن تبلغنا عن أي خطأ، وخاصة في الصياغة العربية.
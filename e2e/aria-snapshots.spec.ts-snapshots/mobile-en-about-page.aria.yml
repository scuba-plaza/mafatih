- main:
  - heading "About" [level=1]
  - region "What you type":
    - heading "What you type" [level=2]
    - paragraph: Mafatih means "keys". It teaches touch typing in Arabic. In Recitation you type the Qur'an, passage by passage, exactly as it is written. In Practice you drill everyday words, with their marks, until each key is under your fingers.
    - paragraph: "The Qur'an is only ever shown whole and in order, and only in Recitation, from the Tanzil text without changes. Practice never uses it: its words are everyday vocabulary."
  - region "Privacy":
    - heading "Privacy" [level=2]
    - paragraph: Mafatih has no accounts, cookies or analytics. Your progress and settings stay in this browser, in local storage. Recitation audio you have played, or that is about to play, is kept in the browser's IndexedDB so that it plays again without downloading. The only request to another site is for that audio, from EveryAyah, which sees your address as any site you visit does. Mafatih sends nothing else about you. Backup and restore in Settings makes a file that you keep yourself.
